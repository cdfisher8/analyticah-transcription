name: Draft regression tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-tests:
    name: Synthetic contracts and UI tests (not live verification)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Run dependency-free synthetic regression suite
        run: node --test tests/*.test.cjs
